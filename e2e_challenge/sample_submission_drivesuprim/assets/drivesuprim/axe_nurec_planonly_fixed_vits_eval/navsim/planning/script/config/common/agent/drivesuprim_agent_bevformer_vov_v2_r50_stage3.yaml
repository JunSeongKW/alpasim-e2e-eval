# Stage 3 of 3 -- end-to-end fine-tune -- for the v2_r50 architecture.
#
# Same recipe as drivesuprim_agent_bevformer_vov_v2_cnx_stage3, re-based onto
# v2_r50 so the architecture keys (ResNet-50 backbone, nuImages-pretrained,
# 56x56 grid, 3 encoder layers, 7 classes, pillar z split) come from that line
# rather than v2_cnx's. drivesuprim_agent_bevformer_vov_v2_r50 itself only
# swaps the image backbone (bevformer_img_backbone / bevformer_cnn_pretrained /
# bevformer_cnn_nuimg_ckpt) on top of v2_cnx -- every other architecture key
# (BEV encoder, FPN, planner, vocabulary, loss weights) is unchanged, so this
# file needs no backbone fields of its own; they arrive through the defaults
# chain below.
#
# Perception is unfrozen here and trained alongside the planner (see cnx_stage3
# for the measured cost of that on v1/cnx -- mAP and seg IoU drop while every
# PDM sub-loss improves). aux_detach_bev / lr_mult_img_backbone knobs exist to
# bias that trade; both OFF by default here, same as cnx_stage3.
#
# Chains from r50_stage2's own final checkpoint (see r50_stage2.yaml's header
# for that lineage's history) -- pass it via CKPT=... at launch.
defaults:
  - drivesuprim_agent_bevformer_vov_v2_r50
  - _self_

config:
  ckpt_path: drivesuprim_bevformer_vov_v2_r50_stage3_ckpt

  planning_loss_weight: 1.0
  freeze_perception: false
  feasibility_enabled: true

  # Identical across all three stages (BEVFormer's FocalLoss 2.0 / L1 0.25);
  # seg 4.5 holds det : seg at 2:1 against this config's 4 decoder layers.
  aux_agent_class_weight: 2.0
  aux_agent_box_weight: 0.25
  aux_bev_seg_weight: 4.5

  scheduler_type: 'cos'
  scheduler_epoch: 30
  scheduler_warm_epoch: 1
  scheduler_min_lr: 1e-6
  optimizer_type: 'adamw'
  weight_decay: 0.01
  scheduler_warmup_iters: 500
  scheduler_warmup_ratio: 0.3333333333333333

checkpoint_path: null      # train.sh passes the stage-2 ckpt via CKPT
lr: 1e-4
