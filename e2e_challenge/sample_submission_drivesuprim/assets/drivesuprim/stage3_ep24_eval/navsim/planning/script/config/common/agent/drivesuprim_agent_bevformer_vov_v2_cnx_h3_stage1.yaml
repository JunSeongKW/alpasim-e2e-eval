# Stage 1 with history frames at FULL encoder depth.
#
# One knob away from drivesuprim_agent_bevformer_vov_v2_cnx_stage1:
# bev_history_encoder_layers 1 -> 3. Everything else -- ConvNeXt backbone, 56x56
# grid, 3 encoder layers, 7 classes, pillar z split, loss weights, LR schedule --
# is inherited unchanged, so a run of this against that isolates history depth.
#
# WHY. The v1 -> v2_cnx regression is almost entirely one metric. At the same
# point of stage 2 (ep3, 12147 scenes):
#
#     EPDMS   0.8441 -> 0.7861   (-0.0579)
#     2F-COM  0.7619 -> 0.5973   (-0.1645)   <- 5.5x the next-largest term
#     DAC     0.9688 -> 0.9390   (-0.0298)
#     everything else within +-0.02, and ego_progress is +0.0431 in our favour
#
# And the direction is wrong, not just the level: through stage 2, v1's 2F-COM
# RISES 0.7038 -> 0.7619 while ours FALLS 0.6298 -> 0.5839. Something is being
# optimised against cross-frame consistency, not merely under-fitted.
#
# two_frame_extended_comfort scores whether consecutive frames pick trajectories
# that agree. It is NOT one of the eight trained metrics and cannot be -- it
# depends on what the PREVIOUS frame chose, so it has no fixed per-candidate
# value and is absent from the PDM score pickles. It is purely emergent from how
# stable the scene representation is across frames, and the only module carrying
# frames is the BEV history path.
#
# Two candidates were checked and ruled out first, both by direct measurement:
#   vocab 8192 -> 4096  swapping the original R34 to 4096 costs 2F-COM only
#                       0.7688 -> 0.7460, and swapping OUR ep3 model back to
#                       8192 gives 0.5973 -> 0.6146. Explains <= 0.023 of 0.165.
#   keyval 784 -> 3136  EPDMS -0.0060 at ep0 shrinking to -0.0032 at ep1 (1.5
#                       sigma), 2F-COM within 0.007. Converges to nothing.
#
# WHAT IT COSTS. Layer-passes 3+1+1=5 -> 3+3+3=9, and NO new parameters: history
# frames reuse the current frame's weights, first N layers only. Measured 9-round
# interleaved: 55.5 -> 63.2 ms, 0.877x. Note the layer-pass ratio is 1.8x but the
# wall-clock ratio is 1.14x -- the image backbone runs per frame either way and
# dominates, so encoder depth on history frames is a small share of the total.
#
# With bev_streaming the cost is exactly zero (1.014x measured): past frames come
# from the cache and are never re-encoded. That path cannot be used for the
# NAVSIM benchmark, whose scenarios sit 7 s apart, but it is the deployment path.
#
# 3 == full depth here, since the encoder has 3 layers (encoder.py:282 slices
# self.layers[:max(1, n_layers)]). This is what v1 did -- its history frames ran
# all 6 of its 6 layers -- reproduced on a 3-layer encoder.
#
# The encoder IS trained in stage 1, so this needs its own stage-1 run; unlike
# the vocab and keyval knobs it cannot be introduced at stage 2.
defaults:
  - drivesuprim_agent_bevformer_vov_v2_cnx_stage1
  - _self_

config:
  ckpt_path: drivesuprim_bevformer_vov_v2_cnx_h3_stage1_ckpt

  bev_history_encoder_layers: 3
